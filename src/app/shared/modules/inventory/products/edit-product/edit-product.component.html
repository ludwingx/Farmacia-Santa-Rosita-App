<div class="container-fluid px-3 px-md-4 py-3">
  <!-- BREADCRUMB -->
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a class="breadcrumb-link text-decoration-none" [routerLink]="getRoute('/dashboard')">
          <i class="fa fa-th-large me-1"></i> Dashboard
        </a>
      </li>
      <li class="breadcrumb-item">
        <a class="breadcrumb-link text-decoration-none" [routerLink]="getRoute('/inventory')">Inventario</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">Editar Medicamento</li>
    </ol>
  </nav>

  <!-- TARJETA PRINCIPAL DEL FORMULARIO -->
  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-header bg-white border-bottom p-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
          <button type="button" class="btn btn-outline-secondary btn-sm rounded-circle p-2" (click)="goToProductList()" title="Volver al inventario">
            <i class="fa fa-arrow-left"></i>
          </button>
          <div>
            <h3 class="h4 fw-bold text-dark mb-0">
              Editar Medicamento: <span class="text-brand-green">{{ product.name }}</span>
            </h3>
            <small class="text-muted">Modifica precios, descripción, categoría y proveedor del catálogo</small>
          </div>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm rounded-3 px-3" (click)="goToProductList()">
          <i class="fa fa-times me-1"></i> Cancelar
        </button>
      </div>
    </div>

    <div class="card-body p-4">
      <form (ngSubmit)="saveProductChanges()" id="editarMedicamentoForm" autocomplete="off">
        <div class="row g-4">
          
          <!-- COLUMNA IZQUIERDA: DATOS DEL PRODUCTO -->
          <div class="col-lg-7">
            <h5 class="fw-bold text-dark mb-3 d-flex align-items-center gap-2">
              <i class="fa fa-pencil-square-o text-brand-green"></i> Especificaciones del Medicamento
            </h5>

            <div class="row g-3">
              <!-- Nombre Comercial -->
              <div class="col-md-8">
                <label for="editName" class="form-label fw-semibold small text-dark">
                  Nombre Comercial / Genérico <span class="text-danger">*</span>
                </label>
                <input 
                  type="text" 
                  id="editName"
                  name="productName"
                  class="form-control" 
                  placeholder="ej. Paracetamol 500 mg" 
                  [(ngModel)]="product.name" 
                  required>
              </div>

              <!-- Código / SKU -->
              <div class="col-md-4">
                <label for="editCode" class="form-label fw-semibold small text-dark">
                  Código / SKU <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa fa-barcode text-muted"></i></span>
                  <input 
                    type="text" 
                    id="editCode"
                    name="productCode"
                    class="form-control" 
                    placeholder="ej. MED-001" 
                    [(ngModel)]="product.product_code" 
                    required>
                </div>
              </div>

              <!-- Descripción -->
              <div class="col-12">
                <label for="editDesc" class="form-label fw-semibold small text-dark">
                  Descripción y Presentación
                </label>
                <textarea 
                  id="editDesc"
                  name="productDesc"
                  class="form-control" 
                  rows="2"
                  placeholder="Detalles de presentación..."
                  [(ngModel)]="product.description"></textarea>
              </div>

              <!-- Categoría -->
              <div class="col-md-6">
                <label for="editCategory" class="form-label fw-semibold small text-dark">
                  Categoría Farmacológica
                </label>
                <select class="form-select" id="editCategory" name="productCat" [(ngModel)]="product.category_id">
                  @for (cat of categories; track cat.id) {
                    <option [value]="cat.id">{{ cat.name }}</option>
                  }
                </select>
              </div>

              <!-- Proveedor -->
              <div class="col-md-6">
                <label for="editSupplier" class="form-label fw-semibold small text-dark">
                  Proveedor / Laboratorio
                </label>
                <select class="form-select" id="editSupplier" name="productSup" [(ngModel)]="product.supplier_id">
                  @for (sup of suppliers; track sup.id) {
                    <option [value]="sup.id">{{ sup.name }}</option>
                  }
                </select>
              </div>

              <div class="col-12"><hr class="my-2"></div>

              <!-- Precio de Venta -->
              <div class="col-md-6">
                <label for="editPrice" class="form-label fw-semibold small text-dark">
                  Precio de Venta al Público (Bs.) <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light fw-bold text-success">Bs.</span>
                  <input 
                    type="number" 
                    id="editPrice"
                    name="productPrice"
                    step="0.50"
                    class="form-control" 
                    [(ngModel)]="product.selling_price" 
                    required>
                </div>
              </div>

              <!-- Stock Actual -->
              <div class="col-md-6">
                <label for="editStock" class="form-label fw-semibold small text-dark">
                  Stock Total Actual (Unidades)
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa fa-cubes text-muted"></i></span>
                  <input 
                    type="number" 
                    id="editStock"
                    name="productStock"
                    class="form-control" 
                    [(ngModel)]="product.current_stock">
                </div>
              </div>

            </div>
          </div>

          <!-- COLUMNA DERECHA: FOTOGRAFÍA, NOTAS Y ACCIONES -->
          <div class="col-lg-5 border-start-lg ps-lg-4">
            <h5 class="fw-bold text-dark mb-3 d-flex align-items-center gap-2">
              <i class="fa fa-picture-o text-brand-rosita"></i> Imagen y Notas
            </h5>

            <div class="card bg-light border-0 rounded-4 p-4 text-center mb-3">
              <div class="product-edit-preview mx-auto mb-3">
                <img 
                  [src]="currentImageSource" 
                  alt="Medicamento" 
                  class="img-fluid rounded-3"
                  (error)="$any($event.target).src = 'assets/img/logo.png'">
              </div>

              <label for="productImageEdit" class="btn btn-outline-primary btn-sm rounded-3 mb-1 fw-semibold">
                <i class="fa fa-upload me-1"></i> Cambiar Imagen
              </label>
              <input 
                type="file" 
                class="d-none" 
                id="productImageEdit" 
                accept="image/*" 
                (change)="onImageChange($event)">
              <small class="text-muted d-block">PNG, JPG o WEBP recomendados</small>
            </div>

            <div class="mb-4">
              <label for="editNotes" class="form-label fw-semibold small text-dark">Notas y Observaciones</label>
              <textarea 
                id="editNotes" 
                name="productNotes"
                class="form-control" 
                rows="2" 
                placeholder="Notas internas..."
                [(ngModel)]="product.notes"></textarea>
            </div>

            <!-- Botones -->
            <div class="d-grid gap-2">
              <button 
                type="submit" 
                class="btn btn-brand-green btn-lg fw-bold rounded-3 shadow-sm"
                [disabled]="isSubmitting">
                @if (isSubmitting) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  <span>Guardando Cambios...</span>
                } @else {
                  <i class="fa fa-floppy-o me-2"></i>
                  <span>Guardar Cambios</span>
                }
              </button>

              <button 
                type="button" 
                class="btn btn-outline-secondary py-2 rounded-3" 
                (click)="goToProductList()">
                Cancelar y Regresar
              </button>
            </div>

          </div>

        </div>
      </form>
    </div>
  </div>
</div>
