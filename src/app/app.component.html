@if (loading) {
  <app-loading></app-loading>
}
@if (!loading && isAuthenticated) {
  <div class="app-container">
    <app-sidebar></app-sidebar>
  </div>
}
@if (!loading && !isAuthenticated) {  
  <div class="login-root-wrapper">
    @if (isRegisterRoute) {
      <app-register></app-register>
    } @else {
      <app-login></app-login>
    }
  </div>
}
